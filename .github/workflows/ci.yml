name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nix
        uses: cachix/install-nix-action@v31

      - name: Check with nix
        run: |
          nix flake check -L

      - name: Build with nix
        run: |
          nix build .#{rust-1_87,rust-1_99}.{toolchain,defaultToolchain}
          ./test
